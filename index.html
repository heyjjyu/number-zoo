<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5fb"><meta name="description" content="귀여운 동물 친구들과 숫자 1부터 10까지 배우고 써봐요.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>알록달록 숫자 동물원</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
:root{--ink:#59445f;--pink:#ff8fbd;--yellow:#ffd66e;--blue:#8edcff;--mint:#a8ebce;--purple:#c9b4ff;--bg:#fff5fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Jua',system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(145deg,#fff4fa 0%,#f0fbff 52%,#fff9e8 100%);overflow-x:hidden}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit}
.app{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:3px 3px 12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#ffb6d3,#ffe18a);display:grid;place-items:center;font-size:31px;box-shadow:0 5px 0 #efc5d7}
.brand b{font-size:23px;display:block}.brand small{font-size:12px;color:#a48ba9}
.progress-pill{background:#fff;border:2px solid #f8d7e8;border-radius:20px;padding:8px 12px;font-size:13px;color:#a46b93}
.progress{height:10px;background:#fff;border-radius:20px;margin:8px 2px 16px;overflow:hidden;box-shadow:inset 0 1px 3px #d8bfd4}.progress>div{height:100%;background:linear-gradient(90deg,#ff9fc8,#ffd66e,#8edcff);border-radius:20px;transition:width .4s}
.card{position:relative;background:#ffffffed;border:3px solid #fff;border-radius:30px;padding:20px 16px 19px;text-align:center;box-shadow:0 12px 30px #b78bb51c;overflow:hidden;min-height:580px}
.card:before,.card:after{content:'✦';position:absolute;color:#ffe18a;font-size:25px;opacity:.8}.card:before{top:13px;left:17px}.card:after{right:18px;top:40px;color:#ffafd0}
.step-label{display:inline-flex;align-items:center;gap:7px;background:#fff0f7;color:#cb6b9a;border-radius:20px;padding:8px 15px;font-size:14px}
h1{font-size:clamp(24px,6vw,32px);margin:16px 0 8px;line-height:1.3}
.sub{font-size:15px;color:#a18aa5;margin:0 0 10px}
.hero-number{font-size:clamp(105px,29vw,155px);line-height:1;color:#ff9aaf;text-shadow:0 7px 0 #ffe0e9;margin:5px auto 0;display:block;animation:bounce .8s ease}
.number-word{font-size:24px;color:#a783c5;margin:3px}
.mascot-wrap{margin:10px auto 7px;display:flex;justify-content:center;align-items:center;gap:14px;min-height:135px}
.mascot{width:116px;height:116px;border-radius:40% 45% 42% 45%;display:grid;place-items:center;font-size:78px;position:relative;filter:drop-shadow(0 7px 0 #f1dce9);animation:float 2.3s ease-in-out infinite}
.mascot:after{content:'♥';position:absolute;font-size:19px;color:#ff8db8;right:4px;top:4px;transform:rotate(15deg)}
.speech{max-width:205px;background:#fff5cf;border:2px solid #ffe6a1;border-radius:19px;padding:12px;font-size:16px;line-height:1.45;position:relative}
.animal-count{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;max-width:520px;margin:12px auto 7px;min-height:155px;padding:10px;background:#f5fbff;border-radius:24px;border:2px dashed #c8eafa}
.animal-count span{font-size:clamp(37px,9vw,58px);display:inline-block;animation:pop .35s both;filter:drop-shadow(0 3px 0 #e5d8ef)}
.count-caption{background:#fff4d4;color:#a77a31;border-radius:18px;padding:10px 14px;display:inline-block;font-size:19px;margin:8px}
.action{display:block;width:100%;max-width:360px;margin:12px auto 0;padding:16px 18px;border-radius:19px;background:linear-gradient(100deg,#ff91bd,#ffb0a6);color:#fff;font-size:19px;box-shadow:0 6px 0 #e87fa8;transition:transform .12s,box-shadow .12s}
.action:active{transform:translateY(4px);box-shadow:0 2px 0 #e87fa8}
.secondary{background:#f1eaff;color:#8566a8;box-shadow:0 5px 0 #d8c9f2}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.actions .action{flex:1;min-width:130px}
.canvas-wrap{width:min(100%,480px);margin:14px auto 8px;background:linear-gradient(135deg,#fff7dc,#f2faff);border:3px dashed #e9c9ee;border-radius:25px;padding:10px;position:relative}
canvas{position:relative;z-index:1;display:block;width:100%;height:350px;touch-action:none;border-radius:16px;background:transparent}
.trace-hint{font-size:15px;color:#a18aa5;margin:8px}.trace-number{position:absolute;z-index:2;inset:12px;display:grid;place-items:center;pointer-events:none;font-size:clamp(250px,65vw,320px);color:#e8c9e6;opacity:.58;line-height:1}
.canvas-tools{display:flex;gap:9px;justify-content:center}.canvas-tools button{padding:11px 16px;border-radius:15px;background:#f1eaff;color:#8566a8;font-size:15px}
.tap-hint{font-size:14px;color:#b08cab;margin:12px 0 0}.mascot{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.canvas-tools .done{background:#a8ebce;color:#397d68}
.step-dots{display:flex;justify-content:center;gap:7px;margin:12px 0}.step-dots i{width:9px;height:9px;border-radius:50%;background:#f2dce9}.step-dots i.on{background:#ff91bd;transform:scale(1.25)}
footer{text-align:center;color:#b39bb7;font-size:13px;padding:14px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;overflow:hidden}.confetti.show{display:block}.confetti span{position:absolute;top:-30px;font-size:25px;animation:fall 1.4s ease-in forwards}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes bounce{0%{transform:scale(.65)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.1}}
@media(min-width:600px){.app{padding-top:25px}.card{padding:26px 30px}.animal-count{min-height:175px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="logo">🦄</div><div><b>알록달록 숫자 동물원</b><small>동물 친구와 숫자 여행을 떠나요!</small></div></div><div class="progress-pill" id="lessonPill">1 / 10</div></header>
<div class="progress"><div id="progressBar" style="width:10%"></div></div>
<section class="card" id="stage"></section>
<footer>우리 천천히, 신나게 숫자 놀이하자! 💗</footer>
</main>
<div class="confetti" id="confetti"></div>
<script>
const friends=[
 {emoji:'🐰',name:'토끼',color:'#ffe6ef',line:'깡충! 숫자를 만나러 가자!'},
 {emoji:'🐻',name:'곰',color:'#fff0d9',line:'안녕! 내가 숫자를 알려줄게!'},
 {emoji:'🐱',name:'고양이',color:'#f0eaff',line:'야옹~ 같이 세어볼까?'},
 {emoji:'🐶',name:'강아지',color:'#e9f7ff',line:'멍멍! 숫자 놀이 신난다!'},
 {emoji:'🐸',name:'개구리',color:'#e6f9ed',line:'폴짝! 숫자를 배워보자!'},
 {emoji:'🦊',name:'여우',color:'#fff0df',line:'짜잔! 내가 친구들을 데려왔어!'},
 {emoji:'🐼',name:'판다',color:'#f0f2ff',line:'대나무처럼 쑥쑥 배워보자!'},
 {emoji:'🐥',name:'병아리',color:'#fff8d9',line:'삐약삐약! 준비됐나요?'},
 {emoji:'🦁',name:'사자',color:'#fff0d9',line:'어흥! 멋지게 해보자!'},
 {emoji:'🐵',name:'원숭이',color:'#f7eaff',line:'우끼끼! 거의 다 왔어!'}
];
const words=['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열'];
let num=1,step=0,drawn=false,ctx,canvas;
const stage=document.getElementById('stage');
let koreanVoice=null;
function chooseKoreanVoice(){
 if(!('speechSynthesis'in window))return;
 const voices=speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
 koreanVoice=voices.find(v=>/google|natural|neural|female|woman|한국어/i.test(v.name))||voices[0]||null;
}
if('speechSynthesis'in window){chooseKoreanVoice();speechSynthesis.onvoiceschanged=chooseKoreanVoice}
function speak(t){
 if(!('speechSynthesis'in window))return;
 chooseKoreanVoice();speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';
 if(koreanVoice)u.voice=koreanVoice;
 u.rate=.94;u.pitch=1.16;u.volume=1;
 speechSynthesis.speak(u);
}
function speakNumber(){
 const f=friends[num-1];
 speak(`안녕! 나는 ${f.name}야. 오늘은 숫자 ${words[num-1]}을 배워볼 거야. 숫자 ${num}!`);
}
function advanceStep(){
 if(step===0){
   step=1;render();
   const f=friends[num-1];
   const countWords=words.slice(0,num).join(', ');
   speak(`${f.name} 친구가 몇 마리 있는지 세어볼까? ${countWords}! 모두 ${words[num-1]} 마리야!`);
 }else if(step===1){
   step=2;drawn=false;render();
   speak(`이제 숫자 ${words[num-1]}을 크게 써보자. 손가락으로 숫자 모양을 따라가 봐!`);
 }
}
function nextNumber(){
 celebrate();
 if(num<10){
   num++;step=0;drawn=false;render();
   speak(`참 잘했어! 다음 숫자는 ${words[num-1]}!`);
 }else{
   renderFinish();
 }
}
function celebrate(){const box=document.getElementById('confetti');box.innerHTML='';for(let i=0;i<24;i++){const s=document.createElement('span');s.textContent=['⭐','💖','🌸','✨','🎈'][i%5];s.style.left=(Math.random()*100)+'%';s.style.animationDelay=(Math.random()*.35)+'s';box.appendChild(s)}box.classList.add('show');setTimeout(()=>box.classList.remove('show'),1700)}
function updateProgress(){document.getElementById('lessonPill').textContent=`${num} / 10`;document.getElementById('progressBar').style.width=((num-1+step/3)/10*100)+'%'}
function render(){
 updateProgress();const f=friends[num-1];
 if(step===0){
 stage.innerHTML=`<div class="step-label">🌟 ${num}번째 숫자 친구</div><h1>오늘의 숫자는?</h1><p class="sub">${f.name} 친구를 톡 눌러봐!</p><div class="mascot-wrap"><div class="mascot" id="mascot" role="button" aria-label="숫자 다시 듣기" style="background:${f.color}">${f.emoji}</div><div class="speech">${f.line}<br><b>숫자 ${num}!</b></div></div><div class="hero-number">${num}</div><div class="number-word">${words[num-1]}</div><p class="tap-hint">화면 아무 곳이나 톡 누르면 동물 친구들을 만나요 👉</p>`;
 document.getElementById('mascot').onclick=e=>{e.stopPropagation();speakNumber()};
 }else if(step===1){
 stage.innerHTML=`<div class="step-label">🐾 동물 친구 세기</div><h1>${f.name} 친구가 몇 마리일까?</h1><p class="sub">동물 친구를 하나씩 세어보자!</p><div class="animal-count">${Array.from({length:num},(_,i)=>`<span style="animation-delay:${i*.07}s">${f.emoji}</span>`).join('')}</div><div class="count-caption">${words[num-1]}! 모두 ${num}마리야.</div><div class="mascot-wrap" style="min-height:90px"><div class="mascot" id="mascot" style="width:76px;height:76px;font-size:51px;background:${f.color}">${f.emoji}</div><div class="speech">나를 누르면 숫자를 다시 들려줄게!</div></div><p class="tap-hint">화면을 톡 누르면 숫자 쓰기로 넘어가요 👉</p>`;
 document.getElementById('mascot').onclick=e=>{e.stopPropagation();speakNumber()};
 }else{
 stage.innerHTML=`<div class="step-label">✏️ 숫자 따라 쓰기</div><h1>숫자 ${num}을 크게 써볼까?</h1><p class="sub">커다란 숫자 모양을 따라 손가락으로 그려봐!</p><div class="canvas-wrap"><div class="trace-number">${num}</div><canvas id="writeCanvas" width="600" height="500" aria-label="숫자 따라 쓰기 영역"></canvas></div><p class="trace-hint">숫자를 다 썼으면 그림판 바깥을 톡 눌러 다음 숫자로 가요 👆</p><div class="canvas-tools"><button id="clear">다시 쓰기 ↺</button></div><div class="step-dots"><i class="on"></i><i class="on"></i><i class="on"></i></div>`;
 setupCanvas();
 document.getElementById('clear').onclick=e=>{e.stopPropagation();clearCanvas()};
 }
}
function setupCanvas(){canvas=document.getElementById('writeCanvas');ctx=canvas.getContext('2d');ctx.lineWidth=30;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#ff86b4';let drawing=false;
 function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
 canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+1,p.y+1);ctx.stroke();drawn=true};
 canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
 const stop=()=>drawing=false;canvas.onpointerup=stop;canvas.onpointercancel=stop;canvas.onpointerleave=stop;
}

stage.onclick=e=>{
 if(e.target.closest('button')||e.target.closest('canvas'))return;
 if(step===2){
   if(drawn)nextNumber(); else speak(`괜찮아! 숫자 ${num}을 한 번 그려볼까?`);
 }else advanceStep();
};
function clearCanvas(){if(ctx&&canvas)ctx.clearRect(0,0,canvas.width,canvas.height);drawn=false}
function renderFinish(){updateProgress();stage.innerHTML=`<div class="step-label">🏆 숫자 여행 완료!</div><h1>우와! 숫자 1부터 10까지<br>모두 배웠어요!</h1><div class="mascot-wrap"><div class="mascot" style="background:#fff0d9;font-size:85px">🐻</div><div class="speech">정말 대단해요!<br>숫자 박사님이 됐어요!</div></div><div style="font-size:52px;margin:18px">🌈 ⭐ 🎉</div><button class="action" id="again">처음부터 다시 놀기</button>`;document.getElementById('again').onclick=()=>{num=1;step=0;render()};speak('축하해! 숫자 열까지 모두 배웠어! 정말 멋지다!')}
render();
speakNumber();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
